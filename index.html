<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wishlist</title>
    <meta name="description" content="Список желаний: покупки, поездки, накопления — всё на этом устройстве." />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("wishlist-theme");
          var dark = t !== "light";
          var r = document.documentElement;
          r.classList.toggle("light", !dark);
          r.classList.toggle("dark", dark);
          r.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#0c1018" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wishlist" />
    <link rel="icon" type="image/svg+xml" href="/wishlist/favicon.svg" />
    <link rel="manifest" href="/wishlist/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/wishlist/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
